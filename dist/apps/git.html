<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Git Diff Viewer — Code Editor</title>
  <link rel="icon" type="image/png" href="assets/app-icon.png"
    onerror="this.href='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23007acc%22/%3E%3C/svg%3E'" />
  <link rel="stylesheet" href="css/startpage.css" />
  <link rel="stylesheet" href="css/git.css" />
</head>

<body>
  <!-- ===================== Top bar (consistent with startpage) ===================== -->
  <header class="topbar" id="topbar">
    <div class="brand">
      <img src="assets/app-icon.png" alt="Logo" class="brand-icon" onerror="this.style.display='none'" />
      <span class="brand-name">Code Editor</span>
    </div>
    <nav class="nav">
      <a href="startpage.html" class="nav-link">Start</a>
      <a href="index.html" class="nav-link">Editor</a>
      <a href="git.html" class="nav-link active">Git</a>
      <a href="about.html" class="nav-link">About</a>
    </nav>
    <button class="launch-btn" onclick="if(window.devkit){devkit.OpenEditor();}else{location.href='index.html';}">
      Launch Editor
    </button>
  </header>

  <!-- ===================== App shell ===================== -->
  <div class="git-app" id="git-app">
    <!-- Toolbar -->
    <div class="git-toolbar">
      <div class="toolbar-title">
        <h1>Git Diff Viewer</h1>
        <p>交互式可视化 DiffResult 中的 git diff 差异结果</p>
      </div>
      <div class="toolbar-actions">
        <button class="git-btn primary" id="btn-open">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="17 8 12 3 7 8" />
            <line x1="12" y1="3" x2="12" y2="15" />
          </svg>
          打开 JSON
        </button>
        <div class="git-search-wrap">
          <input type="text" class="git-input search" id="search" placeholder="搜索文件…" autocomplete="off" />
        </div>
        <select class="git-select" id="kind-filter">
          <option value="all">全部类型</option>
          <option value="0">Added</option>
          <option value="1">Modified</option>
          <option value="2">Deleted</option>
          <option value="3">Renamed</option>
        </select>
        <label class="git-toggle" title="隐藏上下文行，仅显示新增/删除">
          <input type="checkbox" id="hide-context" />
          <span class="track"></span>
          <span>仅改动</span>
        </label>
        <button class="git-btn" id="btn-collapse" title="折叠/展开当前文件所有 hunk">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <polyline points="7 13 12 18 17 13" />
            <polyline points="7 6 12 11 17 6" />
          </svg>
          折叠/展开
        </button>
        <button class="git-btn" id="btn-copy" title="复制当前文件 diff 文本">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
          </svg>
          复制
        </button>
      </div>
    </div>

    <!-- Body: file list + diff view -->
    <div class="git-body">
      <aside class="file-list" id="file-list">
        <div class="file-list-header">
          <span>变更文件</span>
          <span class="count-pill" id="file-count">0</span>
        </div>
        <div class="file-list-scroll" id="file-list-scroll">
          <div class="file-list-empty">尚未加载数据<br />点击「打开 JSON」或拖入文件</div>
        </div>
      </aside>

      <section class="diff-view" id="diff-view">
        <div class="diff-empty" id="diff-empty">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
              <circle cx="6" cy="6" r="3" />
              <circle cx="18" cy="18" r="3" />
            </svg>
          </div>
          <h2>加载 DiffResult JSON</h2>
          <p>选择由 git diff 解析模块序列化得到的 <code>DiffResult</code> JSON 文件，即可在此交互式查看每个文件的差异、行号与增删着色。</p>
          <button class="git-btn primary" id="btn-open-2">打开 JSON 文件</button>
        </div>
        <div class="diff-scroll" id="diff-scroll" style="display:none"></div>
      </section>
    </div>
  </div>

  <!-- ===================== Status bar ===================== -->
  <footer class="statusbar">
    <span class="status-item">Git Diff Viewer</span>
    <span class="status-item status-add" id="status-total">未加载数据</span>
    <span class="status-item" style="margin-left:auto" id="status-file"></span>
  </footer>

  <!-- ===================== Footer ===================== -->
  <footer class="footer" id="footer">
    <nav class="footer-links">
      <a href="startpage.html">Start</a>
      <span>·</span>
      <a href="index.html">Editor</a>
      <span>·</span>
      <a href="git.html">Git</a>
      <span>·</span>
      <a href="about.html">About</a>
    </nav>
    <span class="footer-copy">Code Editor v1.4.2.2</span>
  </footer>

  <!-- Hidden file input -->
  <input type="file" id="file-input" accept=".json,application/json" style="display:none" />

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="dist/devkit.js" type="text/javascript"></script>
  <script src="dist/git.js" type="text/javascript"></script>
</body>

</html>
